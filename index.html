<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Şirinler Köyü – Matematik Macerası</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#b8eaff;color:#16364d;overflow:hidden}#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#79cbff 0%,#c9f2ff 58%,#83ce87 58%,#60b86e 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}header{position:absolute;top:env(safe-area-inset-top,12px);left:0;right:0;display:flex;justify-content:space-around;gap:5px;padding:10px 8px;pointer-events:none}.pill{background:#ffffffec;border:3px solid #b4dbef;border-radius:35px;padding:7px 9px;font-size:clamp(12px,3.5vw,19px);font-weight:800;white-space:nowrap}#question{position:absolute;top:calc(env(safe-area-inset-top,12px) + 65px);left:2%;width:96%;border:4px solid #ffc15c;background:#fff9e9;border-radius:24px;padding:13px 10px;text-align:center;box-shadow:0 5px 0 #e5a74d;min-height:102px}#q{font-size:clamp(18px,5vw,29px);font-weight:900;line-height:1.2}#sub{margin-top:7px;font-size:clamp(12px,3.5vw,17px);color:#53768b;font-weight:700}#feedback{position:absolute;top:calc(env(safe-area-inset-top,12px) + 180px);width:100%;text-align:center;font-weight:900;font-size:24px;text-shadow:0 2px 3px white;pointer-events:none}footer{position:absolute;bottom:calc(env(safe-area-inset-bottom,5px) + 10px);left:0;right:0;display:flex;justify-content:center;gap:5px;padding:0 5px}button{border:3px solid #77bde2;border-radius:28px;background:#fff;color:#24526c;font-weight:800;font-size:clamp(12px,3.4vw,17px);padding:11px 9px;box-shadow:0 3px 8px #24526c44}#tip{display:none;position:absolute;bottom:78px;left:5%;width:90%;background:#fff9dd;border:3px solid #ffc15c;border-radius:20px;padding:12px;text-align:center;font-weight:700}#start{position:absolute;inset:0;background:#18436199;display:flex;align-items:center;justify-content:center;padding:20px}#start>div{max-width:400px;background:#fff8e8;border:4px solid #ffca66;border-radius:25px;padding:22px;text-align:center}#start button{font-size:20px;padding:14px 30px;background:#e0ffd5}</style></head><body><div id="game"><canvas id="c"></canvas><header><span class="pill" id="level">🌟 Etap 1</span><span class="pill" id="score">⭐ 0 puan</span><span class="pill" id="hearts">💙💙💙</span><span class="pill" id="streak">🔥 Seri 0</span></header><div id="question"><div id="q"></div><div id="sub"></div></div><div id="feedback"></div><div id="tip"></div><footer><button id="sound">🔊 Ses açık</button><button id="hint">💡 İpucu (−5)</button><button id="restart">🔄 Yeniden başlat</button></footer><div id="start"><div><h1>🍄 Şirinler Köyü</h1><p>Üç mantar evin üzerindeki cevapları oku ve doğru eve dokun! Her soruda seçenekler ve sorular değişir.</p><button id="play">▶ Oyuna başla</button></div></div></div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,homes=[],tick=0,locked=false,score=0,hearts=3,streak=0,count=0,current=null,sound=true,used=[],last=-1;const $=id=>document.getElementById(id);
const bank=[
['180° ile 360° arasındaki açıya ne denir?','Çukur açı','Dar açı','Doğru açı','180°den büyük açılara çukur açı denir.','Açılar'],['90° olan açı hangisidir?','Dik açı','Dar açı','Geniş açı','Bir karenin köşesini düşün.','Açılar'],['90°den küçük açı hangisidir?','Dar açı','Geniş açı','Doğru açı','Dik açıdan daha küçüktür.','Açılar'],['90° ile 180° arasındaki açı hangisidir?','Geniş açı','Dar açı','Tam açı','Dik açıdan büyük, doğru açıdan küçük.','Açılar'],['180° olan açı hangisidir?','Doğru açı','Tam açı','Dik açı','Düz çizgi oluşturur.','Açılar'],['360° olan açı hangisidir?','Tam açı','Doğru açı','Geniş açı','Bir tam turdur.','Açılar'],['Bir üçgenin iç açıları toplamı kaç derecedir?','180°','90°','360°','Üçgenin açıları yarım tur eder.','Açılar'],['Bir dörtgenin iç açıları toplamı kaç derecedir?','360°','180°','270°','İki üçgen kadar.','Açılar'],['45° açının türü nedir?','Dar açı','Dik açı','Geniş açı','90°den küçüktür.','Açılar'],['125° açının türü nedir?','Geniş açı','Dar açı','Tam açı','90°den büyüktür.','Açılar'],['Bir doğru açı kaç dik açıya eşittir?','2','3','4','180 ÷ 90 işlemini yap.','Açılar'],['Bir tam açı kaç dik açıya eşittir?','4','2','3','360 ÷ 90 işlemini yap.','Açılar'],['Bir üçgenin kaç kenarı vardır?','3','4','5','Adındaki üç sözcüğünü düşün.','Şekiller'],['Karenin kaç eşit kenarı vardır?','4','3','5','Dört kenarı da eşittir.','Şekiller'],['Dikdörtgenin kaç köşesi vardır?','4','3','6','Kare ile aynı köşe sayısı.','Şekiller'],['Beşgenin kaç kenarı vardır?','5','6','4','Adından tahmin et.','Şekiller'],['Altıgenin kaç köşesi vardır?','6','5','8','Kenar sayısı ile köşe sayısı eşittir.','Şekiller'],['Çemberin kaç köşesi vardır?','0','1','2','Yuvarlak çizginin köşesi yoktur.','Şekiller'],['Küpün kaç yüzü vardır?','6','8','4','Zar şeklini düşün.','Geometri'],['Küpün kaç ayrıtı vardır?','12','8','6','Üstte 4, altta 4, arada 4.','Geometri'],['Bir dikdörtgenin alanı nasıl bulunur?','Kısa × uzun','Tüm kenarlar toplamı','Kısa + uzun','İki kenarı çarp.','Geometri'],['Çevresi 20 cm olan karenin bir kenarı kaç cm?','5','4','10','20 sayısını 4’e böl.','Geometri'],['7 × 8 işleminin sonucu kaçtır?','56','54','64','7 tane 8 topla.','Sayılar'],['125 + 275 kaç eder?','400','350','450','Yüzlükleri ve onlukları topla.','Sayılar'],['900 − 365 kaç eder?','535','545','565','Çıkarma işlemi yap.','Sayılar'],['144 ÷ 12 kaçtır?','12','14','11','12 × 12 = 144.','Sayılar'],['3/4 kesrinin payı kaçtır?','3','4','7','Pay üstte yazılır.','Kesirler'],['1/2 ile 2/4 arasındaki ilişki nedir?','Eşittir','1/2 daha büyüktür','2/4 daha büyüktür','İkisi de yarımı gösterir.','Kesirler'],['0,5 hangi kesre eşittir?','1/2','1/4','3/4','Bir bütünün yarısı.','Ondalık'],['2,75 sayısının onda birler basamağı nedir?','7','5','2','Virgülden sonraki ilk rakam.','Ondalık'],['1 kilometre kaç metredir?','1000','100','10000','Kilo ön eki bin demektir.','Ölçüler'],['Bir saatte kaç dakika vardır?','60','100','30','Yarım saat 30 dakikadır.','Ölçüler'],['3, 6, 9, 12, ? örüntüsünde sıradaki sayı?','15','14','18','Her seferinde 3 ekle.','Örüntüler'],['2, 4, 8, 16, ? sıradaki sayı?','32','24','30','Her sayı iki katına çıkıyor.','Örüntüler'],['Bir tam sayının 5 katı 45 ise sayı kaçtır?','9','8','10','45 ÷ 5.','Problemler'],['24 elma 6 kişiye eşit dağıtılırsa kişi başı kaç elma düşer?','4','6','3','24 ÷ 6.','Problemler']];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);homes=[.19,.5,.81].map(x=>({x:x*W,y:H*.68,w:Math.min(W*.29,150)}))}addEventListener('resize',resize);resize();
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function update(){ $('level').textContent='🌟 Etap '+(Math.floor(count/8)+1);$('score').textContent='⭐ '+score+' puan';$('hearts').textContent='💙'.repeat(hearts)+'🩶'.repeat(3-hearts);$('streak').textContent='🔥 Seri '+streak}
function next(){locked=false;$('feedback').textContent='';$('tip').style.display='none';if(used.length===bank.length)used=[];let available=bank.map((_,i)=>i).filter(i=>!used.includes(i)&&i!==last),i=available[Math.floor(Math.random()*available.length)];used.push(i);last=i;const b=bank[i];current={q:b[0],correct:b[1],choices:shuffle([b[1],b[2],b[3]]),hint:b[4],cat:b[5]};$('q').textContent=current.q;$('sub').textContent='📐 '+current.cat+' · Soru '+(count+1)+' · Cevap için eve dokun';update()}
function speak(t){if(!sound||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=1;speechSynthesis.speak(u)}
function choose(i){if(locked||!current)return;locked=true;let good=current.choices[i]===current.correct;if(good){score+=10+Math.min(streak,5)*2;streak++;$('feedback').textContent='🎉 Harika! Doğru cevap!';$('feedback').style.color='#176b37';speak('Harika! Doğru cevap.')}else{hearts--;streak=0;$('feedback').textContent='💫 Doğru cevap: '+current.correct;$('feedback').style.color='#a8373e';speak('Doğru cevap '+current.correct)}count++;update();setTimeout(()=>{if(hearts<=0){hearts=3;$('feedback').textContent='💙 Canların yenilendi!';setTimeout(next,650)}else next()},1250)}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function tree(x,y,s){ctx.fillStyle='#986c44';ctx.fillRect(x-4*s,y-7*s,8*s,40*s);ellipse(x,y-13*s,18*s,22*s,'#4cb96d');ellipse(x+11*s,y-6*s,16*s,18*s,'#249e62')}
function smurf(x,y,s,phase){let dy=Math.sin(tick*.06+phase)*2;ctx.save();ctx.translate(x,y+dy);ellipse(0,4*s,12*s,4*s,'#357c4e55');roundRect(-7*s,-19*s,14*s,18*s,6*s,'#1889ed');ellipse(0,-26*s,11*s,12*s,'#39aaff');ellipse(-4*s,-28*s,2*s,3*s,'white');ellipse(4*s,-28*s,2*s,3*s,'white');ellipse(-3*s,-28*s,1*s,2*s,'#122b46');ellipse(5*s,-28*s,1*s,2*s,'#122b46');ctx.fillStyle='white';ctx.beginPath();ctx.moveTo(-12*s,-33*s);ctx.quadraticCurveTo(-9*s,-57*s,2*s,-48*s);ctx.quadraticCurveTo(15*s,-48*s,11*s,-36*s);ctx.closePath();ctx.fill();roundRect(-10*s,-6*s,9*s,6*s,3*s,'white');roundRect(2*s,-6*s,9*s,6*s,3*s,'white');ctx.restore()}
function house(h,i){let {x,y,w}=h,roof=['#ed6470','#f4c84e','#b78ee8'][i],r=w*.56;ellipse(x,y+27,w*.55,13,'#348b5366');roundRect(x-w*.33,y-w*.34,w*.66,w*.62,13,'#fff0c8');ctx.strokeStyle='#9c7c58';ctx.lineWidth=3;ctx.strokeRect(x-w*.33,y-w*.12,w*.66,w*.38);ellipse(x,y-w*.34,w*.53,w*.42,roof);ellipse(x-w*.2,y-w*.45,w*.075,w*.045,'#fff7d8');ellipse(x+w*.19,y-w*.39,w*.07,w*.045,'#fff7d8');roundRect(x-w*.11,y+w*.04,w*.22,w*.25,12,'#7d543f');ellipse(x+w*.07,y+w*.16,2,2,'#ffd86a');let fs=Math.max(12,Math.min(17,w*.16));ctx.font='900 '+fs+'px system-ui';let txt=current?.choices[i]||'?',max=w*.9;while(ctx.measureText(txt).width>max&&fs>10){fs--;ctx.font='900 '+fs+'px system-ui'}roundRect(x-w*.5,y-w*.91,w,35,13,'#ffffffee');ctx.strokeStyle='#5486a2';ctx.lineWidth=2;ctx.strokeRect(x-w*.5,y-w*.91,w,35);ctx.fillStyle='#173b54';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y-w*.91+17, max)}
function draw(){tick++;ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#79c9fa');sky.addColorStop(.65,'#d3f4ff');sky.addColorStop(.651,'#90d58a');sky.addColorStop(1,'#5fbc71');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ellipse(W*.85,H*.25,32,32,'#ffe781');for(let j=0;j<3;j++){let x=(j*.41*W+tick*(j%2?-.12:.1))%(W+130);for(let k=0;k<4;k++)ellipse(x+k*20,H*(.28+j*.08)+Math.sin(tick*.007+j)*4,22,15,'#ffffffb8')}ellipse(W*.2,H*.83,W*.55,H*.27,'#89d18b');ellipse(W*.85,H*.82,W*.59,H*.3,'#7fc982');ellipse(W*.5,H*1.04,W*.85,H*.32,'#5fb973');ctx.fillStyle='#f8dea2';ctx.beginPath();ctx.moveTo(W*.46,H);ctx.lineTo(W*.4,H*.7);ctx.lineTo(W*.52,H*.7);ctx.lineTo(W*.65,H);ctx.fill();for(let j=0;j<12;j++)tree((j*.173*W+20)%W,H*(.57+(j%4)*.055),.55+(j%3)*.13);for(let j=0;j<45;j++)ellipse((j*79)%W,H*(.74+(j*17%24)/100),3,3,j%3?'#fff8b1':'#ff83ae');homes.forEach(house);for(let j=0;j<5;j++){let x=((tick*(.25+j*.09)+j*W*.24)%(W+60))-30;smurf(x,H*(.78+(j%3)*.055),.75,j)}requestAnimationFrame(draw)}
canvas.addEventListener('pointerdown',e=>{let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let idx=homes.findIndex(h=>Math.abs(x-h.x)<h.w*.58&&y>h.y-h.w*1.03&&y<h.y+h.w*.38);if(idx>=0&&$('start').style.display==='none')choose(idx)});$('play').onclick=()=>{$('start').style.display='none';next();speak(current.q)};$('restart').onclick=()=>{score=0;hearts=3;streak=0;count=0;used=[];last=-1;next()};$('hint').onclick=()=>{if(!current||locked)return;score=Math.max(0,score-5);$('tip').textContent='💡 '+current.hint;$('tip').style.display='block';update()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Ses açık':'🔇 Ses kapalı';if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};draw();
</script></body></html>
