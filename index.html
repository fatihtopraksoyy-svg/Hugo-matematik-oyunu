<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Hugo Matematik Treni</title><style>*{box-sizing:border-box}body{margin:0;background:#101f39;color:white;font-family:system-ui,Arial;text-align:center}main{max-width:650px;margin:auto;padding:12px}h1{font-size:clamp(22px,5vw,34px);margin:12px 0}#stats{font-size:19px;margin:10px}canvas{width:100%;border:4px solid white;border-radius:18px;display:block;background:#8bd2ff;touch-action:manipulation}#question{font-size:clamp(21px,5vw,29px);font-weight:800;margin:14px 0;min-height:40px}.buttons{display:flex;gap:8px}.buttons button{flex:1;background:#ffdb49;border:0;border-radius:15px;padding:18px 3px;color:#0871d1;font-size:clamp(15px,4vw,22px);font-weight:900}button:disabled{opacity:.6}#message{min-height:28px;margin:12px;font-weight:700}#restart{padding:10px 22px;border-radius:12px;border:1px solid #7a99ba;background:#233e60;color:white}</style></head><body><main><h1>🚂 HUGO MATEMATİK TRENİ</h1><div id="stats">⭐ Puan: <span id="score">0</span>　🏆 Seviye: <span id="level">1</span>　❤️ <span id="lives">3</span></div><canvas id="game" width="600" height="650"></canvas><div id="question"></div><div class="buttons"><button data-lane="0">SOL RAY</button><button data-lane="1">ORTA RAY</button><button data-lane="2">SAĞ RAY</button></div><div id="message" aria-live="polite"></div><button id="restart">🔄 Yeniden başla</button></main><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),buttons=[...document.querySelectorAll('[data-lane]')];let score=0,lives=3,round=0,answer=0,labels=[],train={x:300,y:535},moving=false,progress=0,from={x:300,y:535},to={x:300,y:535},last=0,phase='idle',tie=0;
const types=[{name:'DAR AÇI',min:20,max:75},{name:'GENİŞ AÇI',min:110,max:160},{name:'DİK AÇI',min:90,max:90}];const ends=[{x:115,y:205},{x:300,y:205},{x:485,y:205}];function random(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=random(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){moving=false;phase='idle';train={x:300,y:535};labels=shuffle(types.map(t=>({...t,degree:t.min===t.max?90:random(Math.ceil(t.min/5),Math.floor(t.max/5))*5})));answer=random(0,2);document.querySelector('#question').textContent='📐 '+labels[answer].name+' olan rayı seç!';document.querySelector('#message').textContent='Doğru rayı seç ve Hugo’yu kurtar!';buttons.forEach(b=>b.disabled=false);update()}
function update(){document.querySelector('#score').textContent=score;document.querySelector('#level').textContent=1+Math.floor(round/5);document.querySelector('#lives').textContent=lives}
function choose(i){if(moving||lives<=0)return;moving=true;phase='out';progress=0;from={x:300,y:535};to=ends[i];buttons.forEach(b=>b.disabled=true);const ok=i===answer;if(ok){score+=10;document.querySelector('#message').textContent='✅ Harika! Doğru ray!';}else{lives--;document.querySelector('#message').textContent='❌ Yanlış ray! Doğru cevap: '+(['SOL','ORTA','SAĞ'][answer])+' RAY';}update();window.currentCorrect=ok}
buttons.forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.lane))));document.querySelector('#restart').addEventListener('click',()=>{score=0;lives=3;round=0;newRound()});
function rail(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),nx=-dy/len*18,ny=dx/len*18;ctx.lineCap='round';ctx.strokeStyle='#dedede';ctx.lineWidth=7;for(let s of [-1,1]){ctx.beginPath();ctx.moveTo(x1+s*nx,y1+s*ny);ctx.lineTo(x2+s*nx,y2+s*ny);ctx.stroke()}ctx.strokeStyle='#aa794a';ctx.lineWidth=7;for(let t=.03;t<.98;t+=.085){let x=x1+dx*t,y=y1+dy*t;ctx.beginPath();ctx.moveTo(x-nx*1.35,y-ny*1.35);ctx.lineTo(x+nx*1.35,y+ny*1.35);ctx.stroke()}}
function angle(x,y,deg){let a=deg*Math.PI/180;ctx.strokeStyle='white';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+35,y);ctx.moveTo(x,y);ctx.lineTo(x+35*Math.cos(a),y-35*Math.sin(a));ctx.stroke();if(deg===90){ctx.strokeRect(x+3,y-12,12,12)}}
function drawTrain(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#222';ctx.fillRect(-31,22,12,16);ctx.fillRect(19,22,12,16);ctx.fillStyle='#e93d42';ctx.fillRect(-36,-40,72,77);ctx.fillStyle='#ffdf4b';ctx.fillRect(-27,-31,54,28);ctx.fillStyle='#219be5';ctx.fillRect(-27,6,54,24);ctx.fillStyle='white';ctx.font='bold 19px Arial';ctx.textAlign='center';ctx.fillText('HUGO',0,25);ctx.fillStyle='#333';ctx.fillRect(-16,-52,17,13);ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(-9,-59,9,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(ts){const dt=Math.min(40,ts-last||16);last=ts;ctx.clearRect(0,0,600,650);ctx.fillStyle='#89d1fa';ctx.fillRect(0,0,600,220);ctx.fillStyle='#60b554';ctx.fillRect(0,220,600,430);ctx.fillStyle='#ffeaa0';ctx.beginPath();ctx.arc(535,55,34,0,7);ctx.fill();for(let i=0;i<3;i++){rail(300,605,ends[i].x,ends[i].y);let x=25+i*195;ctx.fillStyle='#243b5a';ctx.fillRect(x,65,160,118);ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 19px Arial';ctx.fillText(labels[i]?.name||'',x+80,91);angle(x+63,139,labels[i]?.degree||90);ctx.fillStyle='#ffdc43';ctx.font='bold 23px Arial';ctx.fillText((labels[i]?.degree||90)+'°',x+80,173)}if(moving){progress=Math.min(1,progress+dt/1150);let t=progress*progress*(3-2*progress);train.x=from.x+(to.x-from.x)*t;train.y=from.y+(to.y-from.y)*t;if(progress>=1){moving=false;round++;if(lives<=0){document.querySelector('#question').textContent='🚂 OYUN BİTTİ! Toplam puan: '+score;document.querySelector('#message').textContent='Yeniden başla ve rekorunu kır!'}else newRound()}}drawTrain(train.x,train.y);requestAnimationFrame(draw)}newRound();requestAnimationFrame(draw);
</script></body></html>
