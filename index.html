<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hugo Açılar Ekspresi</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:linear-gradient(#a9e6ff,#e8f9ff 55%,#86bd78 55%);color:#17324c;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:16px}header{text-align:center}h1{margin:10px 0;font-size:clamp(25px,6vw,42px)}.panel{background:#ffffffed;border-radius:22px;padding:17px;box-shadow:0 9px 25px #17436b2b;margin:14px 0}.stats{display:flex;justify-content:space-around;gap:8px;font-weight:800;flex-wrap:wrap}.question{text-align:center;font-size:clamp(20px,4vw,29px);font-weight:800}.angle{display:block;margin:5px auto;width:180px;height:110px}.scene{position:relative;height:275px;overflow:hidden;border-radius:20px;background:linear-gradient(#92dafa 0 64%,#77b66d 64%)}.sun{position:absolute;right:30px;top:20px;font-size:40px}.tracks{position:absolute;inset:0}.track{position:absolute;left:0;right:0;height:60px;background:repeating-linear-gradient(90deg,transparent 0 19px,#604833 19px 28px,transparent 28px 45px);border-top:8px solid #666;border-bottom:8px solid #666;transform:scaleY(.55)}.track:nth-child(1){top:85px}.track:nth-child(2){top:151px}.track:nth-child(3){top:217px}.train{position:absolute;left:5%;top:89px;font-size:52px;line-height:1;transition:top .65s,left .9s;filter:drop-shadow(2px 5px 2px #0004);z-index:3}.station{position:absolute;right:10px;top:31px;font-size:37px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{min-height:94px;border:3px solid #2676a8;border-radius:16px;background:#fff;font-weight:900;font-size:clamp(16px,3.4vw,23px);color:#17466c;cursor:pointer}.choice:active{transform:scale(.97)}.choice small{display:block;font-size:13px;color:#546b80;margin-top:5px}.choice:disabled{opacity:.65}.message{text-align:center;min-height:30px;font-size:19px;font-weight:800}.actions{display:flex;justify-content:center;gap:12px}.btn{background:#125c9a;color:white;border:0;padding:13px 22px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}.help{text-align:center;font-size:14px}#overlay{display:none;position:fixed;inset:0;background:#102b47a8;align-items:center;justify-content:center;padding:20px;z-index:10}#overlay .panel{max-width:400px;text-align:center;width:100%}@media(max-width:450px){.train{font-size:42px}.scene{height:275px}.choice{min-height:80px}.wrap{padding:10px}}</style></head><body><div class="wrap"><header><h1>🚂 Hugo Açılar Ekspresi</h1><div>5. Sınıf • 3 Raylı Matematik Macerası</div></header><div class="panel stats"><span>⭐ Puan: <b id="score">0</b></span><span>❤️ Can: <b id="lives">3</b></span><span>🏆 Soru: <b id="round">1</b>/10</span></div><div class="panel"><div class="question" id="question">Bu açı hangi tür?</div><svg class="angle" viewBox="0 0 180 110" aria-label="Sorudaki açı çizimi"><line x1="55" y1="89" x2="165" y2="89" stroke="#125c9a" stroke-width="7" stroke-linecap="round"/><line id="arm" x1="55" y1="89" x2="140" y2="30" stroke="#ef743e" stroke-width="7" stroke-linecap="round"/><circle cx="55" cy="89" r="7" fill="#183c60"/><text x="105" y="18" id="degree" font-size="22" font-weight="bold" fill="#153f66">45°</text></svg></div><div class="scene"><div class="sun">☀️</div><div class="station">🏁</div><div class="tracks"><div class="track"></div><div class="track"></div><div class="track"></div></div><div class="train" id="train">🚂🚃</div></div><div class="panel"><div class="choices"><button class="choice" data-type="dar">1. RAY<small>Dar açı</small></button><button class="choice" data-type="dik">2. RAY<small>Dik açı</small></button><button class="choice" data-type="genis">3. RAY<small>Geniş açı</small></button></div><p class="message" id="message" aria-live="polite">Doğru rayı seç ve treni ilerlet!</p><div class="actions"><button class="btn" id="restart">🔄 Yeniden Başla</button></div></div><p class="help">Dar açı: 90°'den küçük • Dik açı: 90° • Geniş açı: 90°'den büyük, 180°'den küçük</p></div><div id="overlay"><div class="panel"><h2 id="endTitle">Oyun Bitti</h2><p id="endText"></p><button class="btn" id="playAgain">Tekrar Oyna 🚂</button></div></div><script>const angles=[30,45,60,75,90,90,105,120,135,150,25,80,110,160];let score=0,lives=3,round=1,angle=45,locked=false,finished=false;const $=id=>document.getElementById(id),buttons=[...document.querySelectorAll('.choice')];function typeOf(a){return a<90?'dar':a===90?'dik':'genis'}function newQuestion(){locked=false;buttons.forEach(b=>b.disabled=false);angle=angles[Math.floor(Math.random()*angles.length)];$('degree').textContent=angle+'°';const rad=angle*Math.PI/180;$('arm').setAttribute('x2',55+80*Math.cos(rad));$('arm').setAttribute('y2',89-80*Math.sin(rad));$('question').textContent=`${angle}° ölçüsündeki açı için doğru ray hangisi?`;$('message').textContent='Doğru rayı seç ve treni ilerlet!';$('train').style.left='5%';$('train').style.top='89px';$('round').textContent=round}function finish(){finished=true;$('overlay').style.display='flex';$('endTitle').textContent=lives>0?'🎉 Tebrikler!':'💔 Oyun Bitti';$('endText').textContent=`${round>10?10:round}. soruya ulaştın. Toplam puanın: ${score}`;}function choose(type){if(locked||finished)return;locked=true;buttons.forEach(b=>b.disabled=true);const pos={dar:89,dik:155,genis:221};$('train').style.top=pos[type]+'px';$('train').style.left='68%';const correct=type===typeOf(angle);if(correct){score+=10;$('message').textContent='✅ Harika! Doğru ray! +10 puan';}else{lives--;$('message').textContent=`❌ Yanlış! Doğru cevap: ${{dar:'Dar açı',dik:'Dik açı',genis:'Geniş açı'}[typeOf(angle)]}`;}$('score').textContent=score;$('lives').textContent=lives;setTimeout(()=>{if(lives<=0||round>=10){finish()}else{round++;newQuestion()}},1150)}buttons.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.type)));function restart(){score=0;lives=3;round=1;locked=false;finished=false;$('score').textContent=0;$('lives').textContent=3;$('overlay').style.display='none';newQuestion()}$('restart').onclick=restart;$('playAgain').onclick=restart;newQuestion();</script></body></html>
