
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hugo Açı Treni</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(#b7eaff,#e7f9e8);text-align:center;color:#173b54}
h1{margin:16px 0 5px}
#score{font-weight:bold;font-size:21px}
#question{background:white;border-radius:16px;padding:15px;margin:15px auto;max-width:350px;font-size:23px;font-weight:bold}
#scene{height:310px;position:relative;overflow:hidden;background:linear-gradient(#c6f0ff 65%,#80c775 65%);border-radius:20px;margin:10px}
.track{position:absolute;left:50%;top:65px;width:7px;height:260px;background:#555;transform-origin:top center;border:2px dashed white}
#train{position:absolute;top:25px;left:calc(50% - 27px);font-size:48px;transition:transform .8s}
#message{font-size:22px;font-weight:bold;min-height:30px}
.buttons{display:flex;gap:8px;margin:15px 10px}
button{flex:1;border:0;border-radius:14px;background:#fff;padding:16px 4px;font-size:17px;font-weight:bold;box-shadow:0 3px 8px #aaa;cursor:pointer}
button:active{background:#a6edbf}
#next{background:#ffdc72}
</style>
</head>
<body>
<h1>🚂 HUGO AÇI TRENİ</h1>
<div id="score">⭐ Puan: 0</div>
<div id="question">Soru yükleniyor...</div>
<div id="scene">
<div class="track" style="transform:rotate(35deg)"></div>
<div class="track" style="transform:rotate(0deg)"></div>
<div class="track" style="transform:rotate(-35deg)"></div>
<div id="train">🚂</div>
</div>
<div class="buttons">
<button onclick="answer(0)">📐 Dar Açı</button>
<button onclick="answer(1)">📏 Dik Açı</button>
<button onclick="answer(2)">📐 Geniş Açı</button>
</div>
<div id="message"></div>
<button id="next" onclick="newQuestion()">Yeni Soru ↻</button>
<script>
let score=0;
let correct=0;
let locked=false;
let timer=null;
const names=["Dar Açı","Dik Açı","Geniş Açı"];
const angles=[[20,35,45,60,75],[90],[105,120,135,150,165]];
function newQuestion(){
clearTimeout(timer);
locked=false;
document.getElementById("train").style.transform="translate(0,0) rotate(0deg)";
document.getElementById("message").textContent="";
correct=Math.floor(Math.random()*3);
let arr=angles[correct];
let degree=arr[Math.floor(Math.random()*arr.length)];
document.getElementById("question").textContent=degree+"° hangi açı türüdür?";
}
function answer(choice){
if(locked)return;
if(choice===correct){
locked=true;
score+=10;
document.getElementById("score").textContent="⭐ Puan: "+score;
document.getElementById("message").textContent="✅ Harika! Hugo ilerliyor!";
let x=[-105,0,105][choice];
document.getElementById("train").style.transform="translate("+x+"px,180px)";
timer=setTimeout(newQuestion,1400);
}else{
document.getElementById("message").textContent="❌ Tekrar dene!";
}
}
newQuestion();
</script>
</body>
</html>
