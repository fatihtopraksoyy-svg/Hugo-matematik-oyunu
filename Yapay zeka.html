<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hugo Matematik Ekspresi</title><style>*{box-sizing:border-box}body{margin:0;background:#08172a;color:white;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:10px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 4px #000}#hud span{background:#10294dbb;padding:7px;border-radius:9px}#question{position:fixed;top:60px;left:5%;width:90%;text-align:center;background:#102a50ed;border:2px solid #ffe37a;border-radius:18px;padding:12px;font-size:clamp(17px,4.5vw,25px);font-weight:800;box-shadow:0 5px 20px #0008}#overlay{position:fixed;inset:0;background:#07172be9;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:5}#panel{max-width:450px;background:#16365b;border:2px solid #80d9ff;border-radius:24px;padding:24px}button{border:0;background:#ffd35b;color:#1a2331;font-size:21px;font-weight:900;border-radius:15px;padding:14px 28px}#controls{position:fixed;bottom:24px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}#controls button{pointer-events:auto;width:85px;height:70px;background:#ffffffc9;font-size:32px;touch-action:manipulation}#notice{position:fixed;top:155px;left:10%;width:80%;text-align:center;font-size:24px;font-weight:900;text-shadow:0 2px 8px #000;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="level">Etap 1</span><span id="score">Puan 0</span><span id="lives">❤️❤️❤️</span></div><div id="question"></div><div id="notice"></div><div id="controls"><button id="left">◀</button><button id="right">▶</button></div><div id="overlay"><div id="panel"><h1>🚂 Hugo Matematik Ekspresi</h1><p>Hugo raylarda ilerliyor! Doğru cevabın olduğu raya geç. Sorular her tur değişir. Yanlış cevapta da yeni soru gelir.</p><p>5. sınıf • Açılar • Geometrik şekiller • Sayılar</p><button id="start">OYUNA BAŞLA</button></div></div><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const $=id=>document.getElementById(id);let lane=1,score=0,lives=3,round=0,phase=0,playing=false,question=null,flash='',flashUntil=0,last=0,particles=[];const rand=n=>Math.floor(Math.random()*n),pick=a=>a[rand(a.length)];function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function makeQuestion(){let type=round%9,q,a,wrong;switch(type){case 0:{let v=pick([30,45,60,75]);q=`${v}° hangi açı türüdür?`;a='Dar açı';wrong=['Dik açı','Geniş açı'];break}case 1:{let v=pick([100,120,135,150]);q=`${v}° hangi açı türüdür?`;a='Geniş açı';wrong=['Dar açı','Doğru açı'];break}case 2:{let v=pick([20,35,50,65]);q=`${v}° açının tümleri kaç derecedir?`;a=String(90-v)+'°';wrong=[String(180-v)+'°',String(v+20)+'°'];break}case 3:{let v=pick([40,65,80,110]);q=`${v}° açının bütünleri kaç derecedir?`;a=String(180-v)+'°';wrong=[String(90-v)+'°',String(v+10)+'°'];break}case 4:{let n=pick([3,4,5,6,8]);q=`${n} kenarlı çokgenin köşe sayısı kaçtır?`;a=String(n);wrong=[String(n+1),String(n-1)];break}case 5:{let n=pick([3,4,5,6]);q=`${n} kenarlı düzgün çokgenin bir kenarı 7 cm ise çevresi?`;a=String(n*7)+' cm';wrong=[String(n+7)+' cm',String((n+1)*7)+' cm'];break}case 6:{let n=pick([12,15,18,24]);q=`${n} sayısının yarısı kaçtır?`;a=String(n/2);wrong=[String(n/3),String(n-2)];break}case 7:{let n=pick([4,6,8,9]);q=`${n} × 7 işleminin sonucu?`;a=String(n*7);wrong=[String(n*6),String(n*7+7)];break}default:{let v=pick([90,180,360]);q=`${v}° açıya ne denir?`;a=({90:'Dik açı',180:'Doğru açı',360:'Tam açı'})[v];wrong=shuffle(['Dar açı','Geniş açı','Doğru açı','Tam açı','Dik açı'].filter(z=>z!==a)).slice(0,2)}}let options=shuffle([a,...wrong]);return{q,options,correct:options.indexOf(a)}}function next(){question=makeQuestion();$('question').textContent=question.q;round++;$('level').textContent='Etap '+(Math.floor((round-1)/5)+1);$('score').textContent='Puan '+score;$('lives').textContent='❤️'.repeat(lives);phase=0;lane=1}function move(n){if(playing)lane=Math.max(0,Math.min(2,lane+n))}function resolve(){if(lane===question.correct){score+=10;flash='✅ Doğru! +10 puan';for(let i=0;i<22;i++)particles.push({x:W/2,y:H*.67,vx:(Math.random()-.5)*9,vy:-Math.random()*8,life:45,color:pick(['#ffe066','#6bf3c5','#ff8f8f'])})}else{lives--;flash='❌ Doğru cevap: '+question.options[question.correct]}flashUntil=performance.now()+1250;$('notice').textContent=flash;setTimeout(()=>{if(!playing)return;if(lives<=0){playing=false;$('overlay').style.display='flex';$('panel').innerHTML=`<h1>🏁 Oyun Bitti!</h1><h2>${score} puan</h2><p>${round} soru gördün. Tekrar dene!</p><button id="restart">YENİDEN OYNA</button>`;$('restart').onclick=start}else next()},1050)}function start(){score=0;lives=3;round=0;playing=true;$('overlay').style.display='none';next();last=performance.now()}$('start').onclick=start;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1)});let sx=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>30)move(dx>0?1:-1)},{passive:true});function poly(points,fill,stroke,width=1){x.beginPath();points.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=width;x.stroke()}}function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}function txt(s,a,b,size=18,col='white'){x.font=`900 ${size}px system-ui`;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#061428';x.lineWidth=4;x.strokeText(s,a,b);x.fillStyle=col;x.fillText(s,a,b)}function scene(t){let horizon=H*.27,ground=H*.86;let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#62b9ec');sky.addColorStop(.55,'#bcecff');sky.addColorStop(.56,'#6cbd62');sky.addColorStop(1,'#2e763c');rect(0,0,W,H,sky);x.fillStyle='#fff5ad';x.beginPath();x.arc(W*.82,H*.2,35,0,7);x.fill();for(let i=0;i<8;i++){let px=(i*143+40)%Math.max(W,1),py=horizon-12+Math.sin(i)*15;poly([[px-65,horizon+40],[px,py-70],[px+70,horizon+40]],'#5a9b77');}for(let i=0;i<11;i++){let yy=horizon+(i/10)**1.7*(H-horizon),z=(yy-horizon)/(H-horizon),width=W*(.06+.9*z),center=W/2;rect(center-width/2,yy,width,Math.max(3,z*9),'#71553a')}let centers=[W*.2,W*.5,W*.8];centers.forEach((cx,k)=>{let top=W/2+(cx-W/2)*.12;poly([[top-5,horizon],[top+5,horizon],[cx+W*.115,H],[cx-W*.115,H]],'#3c3c45');for(let side of [-1,1]){x.beginPath();x.moveTo(top+side*5,horizon);x.lineTo(cx+side*W*.115,H);x.strokeStyle='#dbe5e8';x.lineWidth=5;x.stroke()}for(let j=0;j<17;j++){let z=((j/17+((t*.00022)%1))%1);let yy=horizon+z*z*(H-horizon),mid=W/2+(cx-W/2)*(.12+.88*z);rect(mid-(W*.012+W*.105*z),yy,W*(.024+.21*z),2+7*z,'#ad8054')}});let gateY=horizon+(phase/100)**2*(H*.58);if(playing){question.options.forEach((op,i)=>{let cx=W*(.2+.3*i),y=gateY,ww=50+(phase/100)*W*.18;rect(cx-ww/2,y-22,ww,42,'#143964');x.strokeStyle='#fbe67c';x.lineWidth=3;x.strokeRect(cx-ww/2,y-22,ww,42);txt(op,cx,y,Math.max(12,Math.min(20,W*.038)),'#fff5b1')})}let hx=W*(.2+.3*lane),hy=H*.79; x.fillStyle='#252b3e';x.beginPath();x.ellipse(hx,hy+29,37,14,0,0,7);x.fill();rect(hx-25,hy-5,50,33,'#de333c');rect(hx-18,hy-32,36,30,'#f5bc82');x.fillStyle='#eeb782';x.beginPath();x.arc(hx,hy-41,21,0,7);x.fill();rect(hx-23,hy-65,46,14,'#247cbd');rect(hx-18,hy-80,36,20,'#247cbd');x.fillStyle='#fff';x.beginPath();x.arc(hx-8,hy-42,5,0,7);x.arc(hx+8,hy-42,5,0,7);x.fill();x.fillStyle='#18202d';x.beginPath();x.arc(hx-7,hy-41,2,0,7);x.arc(hx+9,hy-41,2,0,7);x.fill();txt('HUGO',hx,hy+8,12,'white');for(let p of particles){rect(p.x,p.y,5,5,p.color);p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life--}particles=particles.filter(p=>p.life>0);if(performance.now()>flashUntil)$('notice').textContent=''}function frame(t){let dt=Math.min(40,t-last||16);last=t;if(playing){phase+=dt*(.012+Math.min(score/50000,.009));if(phase>=100){phase=100;playing=false;resolve();setTimeout(()=>{if(lives>0||$('overlay').style.display==='none')playing=lives>0},1060)}}scene(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
