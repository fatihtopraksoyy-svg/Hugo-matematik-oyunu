<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hugo – Açı Rayları</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1930;color:white;font-family:system-ui,-apple-system,Arial;overflow:hidden}#game{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:absolute;top:env(safe-area-inset-top,8px);left:0;width:100%;padding:8px 12px;pointer-events:none}.top{display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 4px #000;font-size:16px}.question{margin:9px auto 0;max-width:650px;padding:12px 14px;background:#102642e8;border:2px solid #79e6ff;border-radius:16px;text-align:center;font-weight:900;font-size:clamp(17px,4.5vw,25px);box-shadow:0 5px 20px #0009}.prompt{font-size:12px;color:#bfefff;letter-spacing:1px;margin-bottom:3px}.controls{position:absolute;bottom:max(17px,env(safe-area-inset-bottom));width:100%;display:flex;justify-content:center;gap:10px;padding:0 9px}.controls button{flex:1;max-width:170px;min-height:65px;border-radius:15px;background:#153553ed;border:2px solid #80eaff;color:white;font-size:16px;font-weight:900;box-shadow:0 5px 0 #071827;touch-action:manipulation}.controls button:active{transform:translateY(3px)}#overlay{position:absolute;inset:0;background:#061429e8;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center}#panel{max-width:460px;background:#17314c;border:2px solid #76e5f8;padding:26px;border-radius:24px;box-shadow:0 20px 50px #0009}h1{margin:0 0 12px;color:#ffe17b;font-size:32px}p{line-height:1.5}#start{padding:15px 35px;background:#ffce43;color:#172336;font-weight:900;font-size:21px;border:0;border-radius:14px}#toast{position:absolute;top:31%;width:100%;text-align:center;font-size:30px;font-weight:900;text-shadow:0 3px 6px #000;pointer-events:none;opacity:0}.hide{display:none!important}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><span id="score">⭐ 0</span><span id="level">SEVİYE 1</span><span id="life">❤️❤️❤️</span></div><div class="question"><div class="prompt">DOĞRU RAYI SEÇ!</div><span id="question">Hazır mısın?</span></div></div><div id="toast"></div><div class="controls"><button data-lane="0">⬅️ SOL</button><button data-lane="1">⬆️ ORTA</button><button data-lane="2">SAĞ ➡️</button></div><div id="overlay"><div id="panel"><h1>🚂 HUGO<br>AÇI RAYLARI</h1><p>Hugo durmadan raylarda koşuyor! Soruyu oku ve doğru cevabın bulunduğu raya geç. Her doğru cevap yeni bir soru getirir.</p><p>👆 Alttaki butonlara dokun veya klavyede ← ↑ → kullan.</p><button id="start">OYUNA BAŞLA ▶</button></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),Q=document.getElementById('question'),scoreEl=document.getElementById('score'),lifeEl=document.getElementById('life'),levelEl=document.getElementById('level'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),toast=document.getElementById('toast');let W=0,H=0,dpr=1,playing=false,score=0,life=3,round=0,lane=1,target=1,progress=0,last=0,flash=0,toastUntil=0,question=null,seed=0;const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function build(){const type=rnd(0,12);let q,a,wrong;switch(type){case 0:q='90° hangi açı türüdür?';a='Dik açı';wrong=['Dar açı','Geniş açı'];break;case 1:q='180° hangi açı türüdür?';a='Doğru açı';wrong=['Tam açı','Dik açı'];break;case 2:q='360° hangi açı türüdür?';a='Tam açı';wrong=['Doğru açı','Geniş açı'];break;case 3:{let n=rnd(1,89);q=n+'° hangi açı türüdür?';a='Dar açı';wrong=['Dik açı','Geniş açı'];break}case 4:{let n=rnd(91,179);q=n+'° hangi açı türüdür?';a='Geniş açı';wrong=['Dar açı','Doğru açı'];break}case 5:{let n=rnd(10,80);q=n+'° açının tümleri kaç derecedir?';a=(90-n)+'°';wrong=[(180-n)+'°',(90+n)+'°'];break}case 6:{let n=rnd(10,170);q=n+'° açının bütünleri kaç derecedir?';a=(180-n)+'°';wrong=[(90+n)+'°',(360-n)+'°'];break}case 7:q='Ölçüsü 90°den küçük açı hangisi?';a='Dar açı';wrong=['Geniş açı','Doğru açı'];break;case 8:q='90° ile 180° arasındaki açı hangisi?';a='Geniş açı';wrong=['Dar açı','Dik açı'];break;case 9:q='Bir doğru açı kaç derecedir?';a='180°';wrong=['90°','360°'];break;case 10:q='Bir tam açı kaç derecedir?';a='360°';wrong=['180°','90°'];break;case 11:{let n=rnd(15,75);q='Toplamı 90° olan iki açıdan biri '+n+'°. Diğeri?';a=(90-n)+'°';wrong=[(180-n)+'°',n+'°'];break}default:{let n=rnd(20,160);q='Toplamı 180° olan iki açıdan biri '+n+'°. Diğeri?';a=(180-n)+'°';wrong=[(90+n)+'°',n+'°'];break}}let answers=[a,...wrong];for(let i=2;i>0;i--){let j=rnd(0,i);[answers[i],answers[j]]=[answers[j],answers[i]]}return{text:q,answers,correct:answers.indexOf(a)}}function next(){question=build();Q.textContent=question.text;progress=0;round++;levelEl.textContent='SEVİYE '+(1+Math.floor(score/5))}function start(){score=0;life=3;round=0;lane=1;target=1;seed=0;playing=true;overlay.classList.add('hide');scoreEl.textContent='⭐ 0';lifeEl.textContent='❤️❤️❤️';next();last=performance.now()}function notify(t,color){toast.textContent=t;toast.style.color=color;toastUntil=performance.now()+850}function choose(i){if(!playing||!question)return;target=i;if(progress<0.3){lane=i} }function resolve(){lane=target;if(target===question.correct){score++;scoreEl.textContent='⭐ '+score;notify('✓ DOĞRU! +1 ⭐','#9cff9c')}else{life--;lifeEl.textContent='❤️'.repeat(life)+'🖤'.repeat(3-life);notify('✗ YANLIŞ!','#ff9090')}if(life<=0){playing=false;panel.innerHTML='<h1>OYUN BİTTİ!</h1><p>Topladığın yıldız: <strong>'+score+' ⭐</strong></p><p>Tekrar dene ve rekorunu kır!</p><button id="start">YENİDEN OYNA ▶</button>';overlay.classList.remove('hide');document.getElementById('start').onclick=start}else next()}document.getElementById('start').onclick=start;document.querySelectorAll('[data-lane]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();choose(+b.dataset.lane)}));addEventListener('keydown',e=>{const k={'ArrowLeft':0,'ArrowUp':1,'ArrowRight':2,'a':0,'w':1,'d':2};if(k[e.key]!==undefined){e.preventDefault();choose(k[e.key])}});let sx=null;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});c.addEventListener('touchend',e=>{if(sx===null)return;let diff=e.changedTouches[0].clientX-sx;if(Math.abs(diff)>35)choose(Math.max(0,Math.min(2,target+(diff>0?1:-1))));sx=null},{passive:true});function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fill()}function lineSeg(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function pos(l,z){const horizon=H*.28,ground=H*.87,depth=Math.pow(z,1.65);return{x:W/2+(l-1)*W*(.085+depth*.235),y:horizon+(ground-horizon)*depth,scale:.18+depth*1.25}}function drawTrack(l){let a=pos(l,0),b=pos(l,1.1);const spread=W*.035;poly([[a.x-spread*.25,a.y],[a.x+spread*.25,a.y],[b.x+spread*1.9,b.y],[b.x-spread*1.9,b.y]],'#38475a');for(let z=0;z<=1.1;z+=.07){let p=pos(l,Math.min(1.1,(z+seed*.11)%1.13));let s=p.scale;lineSeg(p.x-23*s,p.y,p.x+23*s,p.y,'#7a5038',Math.max(2,8*s))}for(let side of [-1,1]){let aa=pos(l,0),bb=pos(l,1.1);lineSeg(aa.x+side*4,aa.y,bb.x+side*16,bb.y,'#b9d4dc',Math.max(3,5*bb.scale));lineSeg(aa.x+side*5,aa.y,bb.x+side*17,bb.y,'#61788b',2)}}function drawHugo(){let p=pos(target,.83),x=p.x,y=p.y-17,scale=Math.min(1.35,Math.max(.78,W/410));ctx.save();ctx.translate(x,y+Math.sin(seed*15)*3);ctx.scale(scale,scale);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,25,26,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2f69bd';ctx.fillRect(-16,-5,32,30);ctx.fillStyle='#e7a66b';ctx.beginPath();ctx.ellipse(0,-30,23,26,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6a3d25';ctx.beginPath();ctx.ellipse(0,-50,25,12,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='white';for(let xx of [-9,9]){ctx.beginPath();ctx.ellipse(xx,-31,7,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17212d';ctx.beginPath();ctx.arc(xx+2,-29,3,0,7);ctx.fill();ctx.fillStyle='white'}ctx.fillStyle='#a95d44';ctx.beginPath();ctx.ellipse(0,-14,10,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#efc18e';ctx.fillRect(-28,1,12,19);ctx.fillRect(16,1,12,19);ctx.fillStyle='#6b3c24';ctx.fillRect(-16,23,12,12);ctx.fillRect(4,23,12,12);ctx.restore()}function draw(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#14335e');sky.addColorStop(.45,'#69b6d0');sky.addColorStop(.46,'#357b65');sky.addColorStop(1,'#1d4c39');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff3a5';ctx.beginPath();ctx.arc(W*.79,H*.19,24,0,7);ctx.fill();for(let i=0;i<16;i++){let x=(i*137+35)%Math.max(W,1),y=H*.30+(i%4)*16;ctx.fillStyle=i%2?'#275f4a':'#2b7653';ctx.beginPath();ctx.moveTo(x-35,y+35);ctx.lineTo(x,y-75);ctx.lineTo(x+35,y+35);ctx.fill()}for(let l=0;l<3;l++)drawTrack(l);if(question){for(let l=0;l<3;l++){let p=pos(l,.43);let bw=Math.min(W*.30,155),bh=54;ctx.fillStyle=l===target?'#ffdf68':'#f3f7fc';ctx.strokeStyle=l===target?'#a96512':'#205d83';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(p.x-bw/2,p.y-78,bw,bh,10);ctx.fill();ctx.stroke();ctx.fillStyle='#172c44';ctx.font='900 '+Math.min(17,Math.max(11,W/27))+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';let ans=question.answers[l];if(ctx.measureText(ans).width>bw-8)ctx.font='900 11px system-ui';ctx.fillText(ans,p.x,p.y-51,bw-8);lineSeg(p.x,p.y-24,p.x,p.y+4,'#eee',4)}}drawHugo();const barW=Math.min(W*.78,400);ctx.fillStyle='#0009';ctx.fillRect((W-barW)/2,H*.235,barW,9);ctx.fillStyle='#ffe069';ctx.fillRect((W-barW)/2,H*.235,barW*progress,9);toast.style.opacity=performance.now()<toastUntil?'1':'0'}function frame(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;if(playing){seed+=dt*(1.5+score*.035);progress+=dt/(Math.max(2.5,5.6-score*.08));if(progress>=1)resolve()}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
