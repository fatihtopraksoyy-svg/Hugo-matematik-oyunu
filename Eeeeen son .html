<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hugo - Açı Macerası</title><style>*{box-sizing:border-box}body{margin:0;background:#120b21;color:white;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:0;width:100%;padding:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 5px #000}#question{position:fixed;top:65px;left:50%;transform:translateX(-50%);width:94%;max-width:470px;background:#21123ad9;border:2px solid #ffd45c;border-radius:16px;text-align:center;padding:10px;font-weight:800;font-size:19px}#answers{position:fixed;top:145px;left:0;width:100%;display:flex;justify-content:space-around;pointer-events:none}.ans{background:#301d55cc;border:1px solid #ffd45c;border-radius:10px;padding:7px 10px;font-weight:800;font-size:13px}#controls{position:fixed;bottom:25px;width:100%;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}button{pointer-events:auto;border:2px solid #ffe78a;background:#4d2d83dd;color:white;font-size:26px;font-weight:bold;border-radius:20px;width:80px;height:65px}#start{position:fixed;inset:0;background:#160e2de8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;z-index:10}#start button{width:190px}#toast{position:fixed;top:220px;left:0;width:100%;text-align:center;font-size:27px;font-weight:900;text-shadow:0 3px 8px black;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud"><span>⭐ <span id="score">0</span></span><span>❤️ <span id="life">3</span></span><span>🏆 <span id="best">0</span></span></div><div id="question">Hangi ray doğru?</div><div id="answers"><span class="ans" id="a0"></span><span class="ans" id="a1"></span><span class="ans" id="a2"></span></div><div id="toast"></div><div id="controls"><button id="left">◀</button><button id="right">▶</button></div><div id="start"><h1>🚂 HUGO<br>AÇI MACERASI</h1><p>Üç rayda ilerle, doğru açıyı seç, yıldızları topla!<br>Sağa ve sola kaydır veya okları kullan.</p><button id="play">BAŞLA ▶</button></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();let lane=1,visualLane=1,score=0,life=3,best=Number(localStorage.getItem('hugoBest')||0),running=false,progress=0,round=0,question,flash=0,particles=[];document.getElementById('best').textContent=best;const types=['Dar açı','Dik açı','Geniş açı'];function shuffle(a){return a.sort(()=>Math.random()-.5)}function newQuestion(){const angle=[30,45,60,90,110,120,135,150][Math.floor(Math.random()*8)];const correct=angle<90?'Dar açı':angle===90?'Dik açı':'Geniş açı';let opts=shuffle([...types]);question={angle,correct,opts,answer:opts.indexOf(correct)};document.getElementById('question').textContent=`${angle}° hangi açı türüdür?`;opts.forEach((v,i)=>document.getElementById('a'+i).textContent=['SOL','ORTA','SAĞ'][i]+': '+v)}function hud(){document.getElementById('score').textContent=score;document.getElementById('life').textContent=life;document.getElementById('best').textContent=best}function toast(s){document.getElementById('toast').textContent=s;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('toast').textContent='',950)}function check(){if(lane===question.answer){score+=10;toast('✅ DOĞRU! +10');flash=1;for(let i=0;i<15;i++)particles.push({x:W/2,y:H*.69,vx:(Math.random()-.5)*8,vy:-Math.random()*8,life:45})}else{life--;toast('❌ YANLIŞ!');flash=-1}if(score>best){best=score;localStorage.setItem('hugoBest',best)}hud();if(life<=0){running=false;document.getElementById('start').style.display='flex';document.querySelector('#start h1').innerHTML='OYUN BİTTİ';document.querySelector('#start p').textContent='Puanın: '+score+' — Tekrar dene!';document.getElementById('play').textContent='YENİDEN OYNA';return}newQuestion()}function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d))}document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1)});let sx=0; c.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>25)move(dx>0?1:-1)},{passive:true});document.getElementById('play').onclick=()=>{score=0;life=3;lane=1;visualLane=1;progress=0;round=0;running=true;newQuestion();hud();document.getElementById('start').style.display='none'};
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function projection(z,l){let p=Math.pow(z,1.65);let y=H*.34+(H*.77)*p;let spread=W*(.09+.35*p);return{x:W/2+(l-1)*spread,y,scale:.15+.95*p}}function star(x,y,r){ctx.save();ctx.translate(x,y);ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.47:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle='#ffed41';ctx.shadowColor='#ffc400';ctx.shadowBlur=22;ctx.fill();ctx.strokeStyle='#fff8b3';ctx.lineWidth=2;ctx.stroke();ctx.restore()}function draw(t){requestAnimationFrame(draw);let dt=Math.min((t-(draw.last||t))/16.67,2);draw.last=t;let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#36103b');sky.addColorStop(.36,'#fa5c15');sky.addColorStop(1,'#3a1024');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff8a19';ctx.beginPath();ctx.arc(W*.78,H*.22,W*.16,0,Math.PI*2);ctx.fill();for(let side of [-1,1]){poly([[side===-1?0:W,H*.32],[W/2+side*W*.17,H*.36],[W/2+side*W*.48,H],[side===-1?0:W,H]],'#8b221e');for(let k=0;k<9;k++){let y=H*(.4+k*.07),x=W/2+side*(W*.24+k*W*.06);line(x,y,x+side*W*.11,y-25,'#f87018',3)}}poly([[W*.45,H*.33],[W*.55,H*.33],[W*1.2,H*1.2],[-W*.2,H*1.2]],'#241d27');if(running){progress+=dt*.0055;visualLane+=(lane-visualLane)*Math.min(1,dt*.2);if(progress>=1){progress-=1;round++;check()}}for(let l=0;l<3;l++){let a=projection(0,l),b=projection(1,l);line(a.x-4*a.scale,a.y,b.x-12*b.scale,b.y,'#07060b',15);line(a.x+4*a.scale,a.y,b.x+12*b.scale,b.y,'#07060b',15);line(a.x-4*a.scale,a.y,b.x-12*b.scale,b.y,'#b9b9b9',5);line(a.x+4*a.scale,a.y,b.x+12*b.scale,b.y,'#e2d5c2',5);for(let j=0;j<17;j++){let z=((j/17+progress)%1),p=projection(z,l);line(p.x-16*p.scale,p.y,p.x+16*p.scale,p.y,'#705039',Math.max(2,8*p.scale))}for(let j=0;j<5;j++){let z=(j/5+progress)%1,p=projection(z,l);star(p.x,p.y-20*p.scale,Math.max(3,17*p.scale))}}let p=projection(.78,visualLane),s=Math.max(.75,Math.min(1.4,W/380));ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);ctx.fillStyle='#6b3922';ctx.fillRect(-37,-12,74,65);ctx.fillStyle='#b97939';ctx.fillRect(-33,-9,66,48);ctx.fillStyle='#e8aa56';ctx.fillRect(-27,0,54,27);ctx.fillStyle='#30202c';ctx.fillRect(-34,47,17,13);ctx.fillRect(17,47,17,13);ctx.fillStyle='#2685b8';ctx.fillRect(-17,-55,34,55);ctx.fillStyle='#f3a36d';ctx.beginPath();ctx.ellipse(-19,-52,10,18,-.25,0,7);ctx.ellipse(19,-52,10,18,.25,0,7);ctx.fill();ctx.fillStyle='#171222';ctx.beginPath();ctx.ellipse(0,-79,27,36,0,0,7);ctx.fill();ctx.fillStyle='#1470ad';ctx.beginPath();ctx.ellipse(0,-105,30,22,0,0,7);ctx.fill();ctx.fillStyle='#0c467d';ctx.fillRect(-24,-108,48,9);ctx.restore();for(let i=particles.length-1;i>=0;i--){let a=particles[i];ctx.fillStyle='#ffe735';ctx.fillRect(a.x,a.y,5,5);a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=.25*dt;a.life-=dt;if(a.life<=0)particles.splice(i,1)}if(flash){ctx.fillStyle=flash>0?'#ffe14a22':'#ff001a33';ctx.fillRect(0,0,W,H);flash*=.88;if(Math.abs(flash)<.02)flash=0}}requestAnimationFrame(draw);
</script></body></html>
