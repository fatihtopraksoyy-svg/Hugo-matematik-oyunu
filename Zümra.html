<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hugo Açı Macerası</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d203b;color:white;font-family:system-ui,Arial;text-align:center}header{padding:12px 6px}h2{margin:2px;font-size:22px}.stats{font-size:17px;margin:8px}#game{display:block;width:min(100vw,540px);height:auto;margin:auto;border:4px solid #fff;border-radius:18px;background:#79c7f2;touch-action:manipulation}.question{font-size:22px;font-weight:800;margin:12px 4px;min-height:30px}.buttons{display:flex;gap:7px;padding:5px;max-width:540px;margin:auto}.buttons button{flex:1;border:0;border-radius:15px;background:#ffdc4a;color:#07519a;font-weight:900;font-size:17px;padding:18px 0}#message{min-height:28px;font-weight:bold}#restart{background:#24486e;color:white;border:1px solid #6685a9;border-radius:12px;padding:10px 20px;margin:6px}</style></head><body><header><h2>🚂 HUGO AÇI MACERASI</h2><div class="stats">⭐ Puan: <span id="score">0</span>　🏆 Seviye: <span id="level">1</span>　❤️ <span id="lives">3</span></div></header><canvas id="game" width="540" height="650"></canvas><div class="question" id="question"></div><div class="buttons"><button onclick="choose(0)">⬅ SOL</button><button onclick="choose(1)">⬆ ORTA</button><button onclick="choose(2)">SAĞ ➡</button></div><div id="message">Doğru raya yönel!</div><button id="restart" onclick="reset()">🔄 Yeniden başla</button>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let score=0,lives=3,round=0,correct=0,choices=[],moving=false,progress=0,target=1,over=false,offset=0;
const types=[{name:'DAR AÇI',deg:45},{name:'DİK AÇI',deg:90},{name:'GENİŞ AÇI',deg:135},{name:'DOĞRU AÇI',deg:180},{name:'TAM AÇI',deg:360}];
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function next(){choices=shuffle([...types]).slice(0,3);correct=Math.floor(Math.random()*3);document.getElementById('question').textContent='📐 '+choices[correct].name+' olan raya git!';document.getElementById('message').textContent='Rayı seç, Hugo ilerlesin!';moving=false;progress=0;target=1}
function update(){document.getElementById('score').textContent=score;document.getElementById('level').textContent=1+Math.floor(score/5);document.getElementById('lives').textContent=lives}
function choose(i){if(moving||over)return;target=i;moving=true;progress=0;document.getElementById('message').textContent=i===correct?'✅ Harika! Hugo ilerliyor!':'❌ Yanlış ray!'}
function reset(){score=0;lives=3;round=0;over=false;update();next()}
function line(a,b,d,e,color,w){x.strokeStyle=color;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke()}
function rail(ax,ay,bx,by){let dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;x.strokeStyle='#e9e9e9';x.lineWidth=7;for(let s of [-15,15])line(ax+nx*s,ay+ny*s,bx+nx*s,by+ny*s,'#eeeeee',7);for(let t=0;t<1;t+=.085){let px=ax+dx*t,py=ay+dy*t;line(px+nx*23,py+ny*23,px-nx*23,py-ny*23,'#a56c3d',8)}}
function angleIcon(cx,cy,deg){let a=deg*Math.PI/180;x.strokeStyle='white';x.lineWidth=4;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+30,cy);x.moveTo(cx,cy);x.lineTo(cx+30*Math.cos(a),cy-30*Math.sin(a));x.stroke()}
function draw(){offset+=moving?4:1;x.fillStyle='#80cdf6';x.fillRect(0,0,540,650);x.fillStyle='#ffe99b';x.beginPath();x.arc(475,80,36,0,7);x.fill();x.fillStyle='#5eaf50';x.fillRect(0,210,540,440);
for(let k=0;k<3;k++){let bx=[105,270,435][k];x.fillStyle=k===target&&moving?'#315c8d':'#243c5b';x.fillRect(bx-83,55,166,116);x.fillStyle='#fff';x.font='bold 18px Arial';x.textAlign='center';x.fillText(choices[k]?.name||'',bx,80);angleIcon(bx-12,125,choices[k]?.deg||90);x.fillStyle='#ffdb40';x.font='bold 22px Arial';x.fillText((choices[k]?.deg||90)+'°',bx,163)}
let sy=590,splitY=405;rail(270,sy,270,splitY);for(let i=0;i<3;i++)rail(270,splitY,[105,270,435][i],185);
let px=270,py=550;if(moving){let t=Math.min(progress,1);if(t<.43){py=550-(550-splitY)*(t/.43)}else{let u=(t-.43)/.57;px=270+([105,270,435][target]-270)*u;py=splitY+(190-splitY)*u}}
x.save();x.translate(px,py);x.fillStyle='#e43c31';x.fillRect(-29,-27,58,57);x.fillStyle='#ffdf50';x.fillRect(-22,-19,44,28);x.fillStyle='#111';x.fillRect(-12,-41,24,14);x.fillStyle='#fff';x.font='bold 14px Arial';x.textAlign='center';x.fillText('HUGO',0,24);x.fillStyle='#222';for(let q of [-20,20]){x.beginPath();x.arc(q,34,8,0,7);x.fill()}x.restore();
if(moving){progress+=.014;if(progress>=1){moving=false;if(target===correct){score+=10;round++;update();next()}else{lives--;update();if(lives<=0){over=true;document.getElementById('question').textContent='OYUN BİTTİ — '+score+' PUAN';document.getElementById('message').textContent='Yeniden başla!'}else next()}}}
requestAnimationFrame(draw)}
reset();draw();document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')choose(0);if(e.key==='ArrowUp')choose(1);if(e.key==='ArrowRight')choose(2)});
</script></body></html>
