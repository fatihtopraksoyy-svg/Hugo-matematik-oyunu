<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hugo - Açılar Macerası</title><style>*{box-sizing:border-box}body{margin:0;background:#120e22;color:white;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;text-align:center;pointer-events:none;padding:8px}#question{background:#17142be8;border:2px solid #ffc84a;border-radius:14px;padding:9px 12px;font-size:clamp(15px,4vw,21px);font-weight:800;max-width:700px;margin:auto}#stats{display:flex;justify-content:space-between;padding:8px 15px;font-weight:800;text-shadow:0 2px 4px #000}#controls{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:100%;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}button{pointer-events:auto;border:2px solid #fff8;border-radius:18px;background:#241e4bdc;color:#fff;font-size:30px;font-weight:bold;padding:12px 27px;touch-action:manipulation}#overlay{position:fixed;inset:0;background:#080617d9;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}#panel{max-width:430px;background:#211938;border:2px solid #ffcf55;border-radius:22px;padding:26px}#panel h1{color:#ffcf55}#panel p{line-height:1.55}#play{background:#e89c22;color:#211322;font-size:22px}#feedback{position:fixed;top:29%;width:100%;text-align:center;font-size:28px;font-weight:900;text-shadow:0 3px 7px black;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="question">Hugo Açılar Macerası</div><div id="stats"><span id="score">⭐ 0</span><span id="lives">❤️❤️❤️</span><span id="level">Soru 1</span></div></div><div id="feedback"></div><div id="controls"><button id="left" aria-label="Sola geç">◀</button><button id="right" aria-label="Sağa geç">▶</button></div><div id="overlay"><div id="panel"><h1>🚃 HUGO<br>AÇILAR MACERASI</h1><p>Üç raydan doğru cevabın olduğu raya geç! Hugo vagonuyla ilerler, her sorudan sonra yenisi gelir.<br><b>◀ ▶</b> tuşlarına dokun veya ekranı kaydır.</p><button id="play">OYUNA BAŞLA</button></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,dpr;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const bank=[];function add(q,correct,wrong1,wrong2){bank.push({q,opts:[String(correct),String(wrong1),String(wrong2)],a:String(correct)})}
[['Dar açı kaç dereceden küçüktür?','90°','180°','360°'],['Dik açının ölçüsü kaç derecedir?','90°','45°','180°'],['Doğru açının ölçüsü kaç derecedir?','180°','90°','360°'],['Tam açının ölçüsü kaç derecedir?','360°','180°','270°'],['Sıfır açının ölçüsü nedir?','0°','90°','180°'],['Geniş açı hangi aralıktadır?','90°–180°','0°–90°','180°–360°'],['120° nasıl bir açıdır?','Geniş','Dar','Dik'],['75° nasıl bir açıdır?','Dar','Geniş','Doğru'],['180° nasıl bir açıdır?','Doğru','Tam','Dik'],['270° nasıl bir açıdır?','Çukur','Dar','Geniş'],['Açı hangi araçla ölçülür?','İletki','Pergel','Cetvel'],['Açının birimi nedir?','Derece','Santimetre','Litre'],['Açıyı oluşturan ışınların başlangıcı?','Köşe','Kenar','Çap'],['Açıların ölçüsü hangi sembolle gösterilir?','°','cm','%'],['Bir dik açı kaç dar açıya bölünebilir?','Birden çok','Hiç','Yalnız 1'],['Komşu açıların ortak özelliği?','Ortak kenar','Eşit ölçü','Toplam 360°'],['Ters açılar arasında nasıl ilişki vardır?','Ölçüleri eşit','Toplam 90°','Toplam 180°'],['Tümler açıların toplamı kaçtır?','90°','180°','360°'],['Bütünler açıların toplamı kaçtır?','180°','90°','360°'],['Bir tam tur kaç derecedir?','360°','90°','180°'],['Yarım tur kaç derecedir?','180°','45°','360°'],['Çeyrek tur kaç derecedir?','90°','180°','270°'],['İki dik açının toplamı?','180°','90°','360°'],['Üç dik açının toplamı?','270°','180°','360°'],['Dik kesişen doğrular hangi açıyı oluşturur?','90°','60°','120°'],['Açıların kolları nedir?','Işın','Çember','Doğru parçası']].forEach(x=>add(...x));
for(let a=10;a<90;a+=10){add(`${a}° açının tümleri kaç derecedir?`,`${90-a}°`,`${180-a}°`,`${a+90}°`)}for(let a=20;a<180;a+=20){add(`${a}° açının bütünleri kaç derecedir?`,`${180-a}°`,`${90+a}°`,`${a}°`)}for(let a=20;a<170;a+=30){add(`Ters açılardan biri ${a}° ise diğeri?`,`${a}°`,`${180-a}°`,`${90+a}°`)}for(let a=15;a<80;a+=15){add(`${a}° + ${90-a}° toplamı hangi açıdır?`,'Dik açı','Geniş açı','Dar açı')}for(let a=30;a<=150;a+=30){add(`180° − ${a}° = ?`,`${180-a}°`,`${90-a}°`,`${a}°`)}
let lane=1,visualLane=1,score=0,lives=3,round=0,question=null,progress=0,travel=0,playing=false,flash='',flashUntil=0,last=0,used=[];const rand=n=>Math.floor(Math.random()*n);function next(){if(used.length>=bank.length)used=[];let ix;do{ix=rand(bank.length)}while(used.includes(ix));used.push(ix);let b=bank[ix],opts=[...b.opts];for(let i=2;i>0;i--){let j=rand(i+1);[opts[i],opts[j]]=[opts[j],opts[i]]}question={...b,opts,correct:opts.indexOf(b.a)};progress=0;round++;document.getElementById('question').textContent=b.q;document.getElementById('level').textContent='Soru '+round}
function update(){document.getElementById('score').textContent='⭐ '+score;document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,lives))}
function move(d){if(!playing)return;lane=Math.max(0,Math.min(2,lane+d))}document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1)});let tx=0,ty=0;canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>30)move(dx>0?1:-1)},{passive:true});document.getElementById('play').onclick=()=>{score=0;lives=3;round=0;lane=1;visualLane=1;used=[];playing=true;document.getElementById('overlay').style.display='none';next();update()};
function poly(pts,color,stroke){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function line(x1,y1,x2,y2,color,width){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}function text(t,x,y,size,color='#fff'){ctx.font=`900 ${size}px system-ui`;ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#171023';ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y)}function pos(i,z){let horizon=H*.24,bottom=H*1.12,k=z*z;return{x:W/2+(i-1)*W*(.055+.36*k),y:horizon+(bottom-horizon)*k,w:W*(.04+.17*k)}}
function draw(time){let dt=Math.min((time-last)/1000||0,.05);last=time;let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#290e2a');sky.addColorStop(.45,'#a53618');sky.addColorStop(1,'#3a1b1c');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);let horizon=H*.24;for(let j=0;j<17;j++){let x=((j*173+Math.sin(j)*37)% (W+100))-50,hh=H*(.16+(j%5)*.06);poly([[x,horizon+70],[x+15,horizon-hh],[x+52,horizon-hh-20],[x+80,horizon+70]],j%2?'#302b31':'#493137');line(x+20,horizon-hh+35,x+45,horizon-hh+35,'#6b4640',5)}poly([[0,H],[W,H],[W*.57,horizon],[W*.43,horizon]],'#241c24');for(let i=0;i<3;i++){let a=pos(i,0),b=pos(i,1);poly([[a.x-a.w*.65,a.y],[a.x+a.w*.65,a.y],[b.x+b.w*.65,b.y],[b.x-b.w*.65,b.y]],i===1?'#30282b':'#36282a');for(let side of [-1,1])line(a.x+side*a.w*.55,a.y,b.x+side*b.w*.55,b.y,'#c6bcb4',3+3*(side+2)/3)}for(let k=0;k<27;k++){let z=((k/27+travel*.24)%1);if(z<.05)continue;for(let i=0;i<3;i++){let p=pos(i,z),w=p.w*.53;line(p.x-w,p.y,p.x+w,p.y,'#6e4c36',Math.max(2,z*11))}}for(let i=0;i<3;i++){let p=pos(i,.43);if(playing){let c=i===question.correct?'#56ed8e':'#ffcf50';poly([[p.x-p.w*1.12,p.y-36],[p.x+p.w*1.12,p.y-36],[p.x+p.w*1.12,p.y+12],[p.x-p.w*1.12,p.y+12]],'#201936dd',c);text(question.opts[i],p.x,p.y-3,Math.max(12,Math.min(20,W*.042)),c)}}
visualLane+=(lane-visualLane)*Math.min(1,dt*11);let p=pos(visualLane,.83),s=Math.min(W/390,H/740)*1.0;ctx.save();ctx.translate(p.x,p.y+35);ctx.scale(s,s);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,53,65,15,0,0,7);ctx.fill();poly([[-52,-13],[52,-13],[47,48],[-47,48]],'#9a4c23','#ffb76b');for(let x of [-45,45]){ctx.fillStyle='#2d2c39';ctx.beginPath();ctx.arc(x,48,12,0,7);ctx.fill()}poly([[-42,-23],[42,-23],[51,0],[-51,0]],'#c77b3a','#e4aa62');line(-34,3,34,3,'#edc18c',5);ctx.fillStyle='#318cce';ctx.fillRect(-16,-62,32,52);ctx.fillStyle='#f3a16c';ctx.fillRect(-31,-53,14,32);ctx.fillRect(17,-53,14,32);ctx.fillStyle='#251a1e';ctx.beginPath();ctx.ellipse(0,-83,31,36,0,0,7);ctx.fill();ctx.fillStyle='#338bc6';ctx.beginPath();ctx.ellipse(0,-102,34,18,0,0,7);ctx.fill();ctx.fillStyle='#49b6f0';ctx.fillRect(-17,-122,34,15);ctx.fillStyle='#3280c7';ctx.fillRect(-16,-20,13,22);ctx.fillRect(4,-20,13,22);ctx.restore();for(let i=0;i<10;i++){let z=((i/10+travel*.15)%1),p=pos(i%2?0:2,z);text('★',p.x,p.y,10+z*24,'#ffe45b')}if(playing){progress+=dt*.23;travel+=dt;if(progress>=1){if(lane===question.correct){score+=10;flash='⭐ DOĞRU! +10';}else{lives--;flash='❌ YANLIŞ RAY!';}flashUntil=time+900;update();if(lives<=0){playing=false;document.getElementById('overlay').style.display='flex';document.getElementById('panel').innerHTML=`<h1>OYUN BİTTİ</h1><p>Toplam puan: <b>${score}</b><br>Çözülen soru: ${round}</p><button id="again" onclick="location.reload()">YENİDEN OYNA</button>`}else next()}}document.getElementById('feedback').textContent=time<flashUntil?flash:'';requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
