<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Hugo Matematik Treni</title><style>*{box-sizing:border-box}body{margin:0;background:#0e203d;color:white;font-family:system-ui,Arial;text-align:center}main{max-width:700px;margin:auto;padding:16px}h1{font-size:clamp(22px,5vw,35px)}.stats{display:flex;justify-content:space-around;font-size:20px;margin:15px 0}canvas{width:100%;border:6px solid white;border-radius:24px;display:block;background:#83cef5;touch-action:manipulation}.question{font-size:clamp(20px,5vw,30px);font-weight:800;min-height:75px;padding:18px 0}.buttons{display:flex;gap:9px}.buttons button{flex:1;background:#ffdc48;color:#0076d6;border:0;border-radius:20px;padding:20px 3px;font-size:clamp(16px,4vw,25px);font-weight:900;cursor:pointer}#feedback{min-height:46px;font-size:19px;font-weight:700;margin:15px}#restart{background:#294769;color:white;border:1px solid #8eb3d2;padding:12px 25px;border-radius:20px;font-size:17px}small{display:block;margin:12px;color:#c8d9f1}</style></head><body><main><h1>🚂 HUGO MATEMATİK TRENİ</h1><div class="stats"><span id="score">⭐ Puan: 0</span><span id="level">🏆 Seviye: 1</span><span id="lives">❤️ 3</span></div><canvas id="game" width="660" height="700"></canvas><div class="question" id="question"></div><div class="buttons"><button onclick="choose(0)">SOL RAY</button><button onclick="choose(1)">ORTA RAY</button><button onclick="choose(2)">SAĞ RAY</button></div><div id="feedback">Doğru rayı seç ve Hugo’yu kurtar!</div><button id="restart" onclick="reset()">🔄 Yeniden başla</button><small>Her doğru cevapta yeni soru • Yanlış cevapta bir can gider</small></main><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let score=0,lives=3,level=1,answer=0,options=[],prompt='',moving=false,over=false,trainY=540,railChoice=1,phase=0,questionCount=0;
const types=[{name:'DAR AÇI',degree:35},{name:'DAR AÇI',degree:65},{name:'DİK AÇI',degree:90},{name:'GENİŞ AÇI',degree:120},{name:'GENİŞ AÇI',degree:145},{name:'DOĞRU AÇI',degree:180},{name:'REFLEKS AÇI',degree:225},{name:'REFLEKS AÇI',degree:300},{name:'TAM AÇI',degree:360},{name:'SIFIR AÇI',degree:0}];
const tasks=[t=>`${t.name} olan rayı seç!`,t=>`${t.degree}° ölçüsündeki açıyı bul!`,t=>`${t.degree}° açı hangi rayda?`,t=>`${t.name} örneğini bul!`];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function next(){if(over)return;let target=types[Math.floor(Math.random()*types.length)];let wrong=shuffle(types.filter(t=>t.degree!==target.degree&&t.name!==target.name)).slice(0,2);options=shuffle([target,...wrong]);answer=options.indexOf(target);prompt=tasks[questionCount%tasks.length](target);questionCount++;document.getElementById('question').textContent='📐 '+prompt;document.getElementById('feedback').textContent='Doğru rayı seç ve Hugo’yu kurtar!';update()}
function update(){document.getElementById('score').textContent='⭐ Puan: '+score;document.getElementById('level').textContent='🏆 Seviye: '+level;document.getElementById('lives').textContent='❤️ '+lives}
function choose(i){if(moving||over)return;railChoice=i;moving=true;trainY=540;let good=i===answer;document.getElementById('feedback').textContent=good?'✅ Doğru! Hugo ilerliyor!':'❌ Yanlış ray! Bir can kaybettin.';let start=performance.now();function animate(now){let p=Math.min((now-start)/850,1);trainY=540-260*p;draw();if(p<1)requestAnimationFrame(animate);else{if(good){score+=10;level=1+Math.floor(score/50)}else lives--;update();moving=false;trainY=540;railChoice=1;if(lives<=0){over=true;document.getElementById('question').textContent='Oyun bitti! Toplam puan: '+score;document.getElementById('feedback').textContent='🔄 Yeniden başla ile tekrar dene.'}else next()}}requestAnimationFrame(animate)}
function reset(){score=0;lives=3;level=1;over=false;moving=false;trainY=540;railChoice=1;questionCount=0;next();draw()}
function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function angle(cx,cy,d){let rad=d*Math.PI/180;line(cx-25,cy+12,cx+25,cy+12,'white',4);line(cx-25,cy+12,cx-25+48*Math.cos(rad),cy+12-48*Math.sin(rad),'white',4);if(d===360){ctx.beginPath();ctx.arc(cx-25,cy+12,15,0,Math.PI*1.85);ctx.strokeStyle='#ffdc48';ctx.lineWidth=3;ctx.stroke()}if(d===90)ctx.strokeRect(cx-25,cy-2,14,14)}
function draw(){ctx.clearRect(0,0,660,700);ctx.fillStyle='#87cefa';ctx.fillRect(0,0,660,260);ctx.fillStyle='#5db24e';ctx.fillRect(0,260,660,440);ctx.fillStyle='#ffe89b';ctx.beginPath();ctx.arc(595,65,38,0,Math.PI*2);ctx.fill();let bottom={x:330,y:665},tops=[{x:110,y:220},{x:330,y:220},{x:550,y:220}];tops.forEach((top,i)=>{let dx=top.x-bottom.x,dy=top.y-bottom.y,len=Math.hypot(dx,dy),nx=-dy/len*18,ny=dx/len*18;for(let s of [-1,1])line(bottom.x+nx*s,bottom.y+ny*s,top.x+nx*s,top.y+ny*s,'#e4e5e5',7);for(let t=.07;t<.99;t+=.095){let x=bottom.x+dx*t,y=bottom.y+dy*t;line(x-nx*1.35,y-ny*1.35,x+nx*1.35,y+ny*1.35,'#a87b4a',8)}ctx.fillStyle='#243c5b';ctx.fillRect(24+i*220,66,172,135);ctx.fillStyle='white';ctx.font='bold 19px system-ui';ctx.textAlign='center';ctx.fillText(options[i]?.name||'',110+i*220,94);if(options[i]){angle(110+i*220,151,options[i].degree);ctx.fillStyle='#ffda43';ctx.font='bold 25px system-ui';ctx.fillText(options[i].degree+'°',110+i*220,185)}});let t=Math.max(0,Math.min(1,(540-trainY)/260));let x=330+(tops[railChoice].x-330)*t*.85,y=trainY;ctx.save();ctx.translate(x,y);ctx.fillStyle='#263a4a';ctx.fillRect(-10,-49,20,24);ctx.fillStyle='#d73939';ctx.fillRect(-41,-32,82,84);ctx.fillStyle='#ffdf47';ctx.fillRect(-31,-23,62,33);ctx.fillStyle='#2196d2';ctx.fillRect(-31,19,62,24);ctx.fillStyle='white';ctx.font='bold 18px system-ui';ctx.fillText('HUGO',0,37);ctx.fillStyle='#282828';ctx.beginPath();ctx.arc(-26,55,10,0,7);ctx.arc(26,55,10,0,7);ctx.fill();ctx.restore()}
function loop(){if(!moving)draw();requestAnimationFrame(loop)}reset();loop();</script></body></html>
