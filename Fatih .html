<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hugo - Matematik Rayları</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07162c;color:white;font-family:system-ui,Arial}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:8px;pointer-events:none}#stats{display:flex;justify-content:space-between;gap:5px;font-weight:800;font-size:14px}#stats span,#question{background:#102c50e8;border:1px solid #ffffff55;border-radius:12px;padding:8px}#question{margin-top:8px;text-align:center;font-size:clamp(16px,4.5vw,23px);border:2px solid #ffdd55}#message{text-align:center;font-weight:900;text-shadow:0 2px 5px black;height:28px;margin-top:6px}#controls{position:fixed;bottom:24px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}.ctrl{pointer-events:auto;border:2px solid #fff;border-radius:50%;background:#145b9de8;color:white;width:76px;height:76px;font-size:34px;touch-action:none}#overlay{position:fixed;inset:0;background:#07162cf2;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:25px;text-align:center;z-index:3}#overlay h1{font-size:36px;color:#ffdd55;margin:0}#overlay p{max-width:400px;line-height:1.5}#start{padding:16px 30px;border:0;border-radius:15px;background:#ffcf3e;font-weight:900;font-size:21px;color:#17243c}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="stats"><span id="score">⭐ 0</span><span id="stage">ETAP 1</span><span id="lives">❤️❤️❤️</span></div><div id="question">Hazır mısın?</div><div id="message"></div></div><div id="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div id="overlay"><h1>🚂 HUGO</h1><h2>MATEMATİK RAYLARI</h2><p>Hugo raylarda ilerlerken soruları çöz! Doğru cevabın bulunduğu raya sağ ve sol düğmeleriyle geç. Her turda yeni soru gelir; yanlış cevapta da oyun devam eder.</p><button id="start">OYUNA BAŞLA ▶</button></div><script>
const c=document.getElementById('game'),g=c.getContext('2d');let W,H,D;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const bank=[
['90° hangi açıdır?',['Dar açı','Dik açı','Geniş açı'],1],['45° hangi açıdır?',['Dar açı','Doğru açı','Geniş açı'],0],['120° hangi açıdır?',['Dik açı','Geniş açı','Dar açı'],1],['180° hangi açıdır?',['Tam açı','Doğru açı','Dik açı'],1],['360° hangi açıdır?',['Tam açı','Dar açı','Doğru açı'],0],['Bir dik açı kaç derecedir?',['180°','90°','360°'],1],['30° + 60° kaçtır?',['100°','90°','80°'],1],['180° - 75° kaçtır?',['105°','95°','115°'],0],['90° - 35° kaçtır?',['65°','55°','45°'],1],['Hangi açı dar açıdır?',['135°','75°','100°'],1],['Hangi açı geniş açıdır?',['60°','90°','150°'],2],['İki dik açının toplamı?',['180°','90°','360°'],0],['Bir dik açı ikiye bölünürse?',['45°','60°','90°'],0],['Açı ölçmek için ne kullanılır?',['Cetvel','İletki','Pergel'],1],['Üçgenin iç açıları toplamı?',['180°','360°','90°'],0],['Dörtgenin iç açıları toplamı?',['180°','270°','360°'],2],['Eşkenar üçgenin bir açısı?',['90°','60°','45°'],1],['Karenin bir iç açısı?',['60°','90°','120°'],1],['Üçgende 50° ve 60° varsa üçüncü açı?',['70°','80°','90°'],0],['Üçgende 90° ve 35° varsa üçüncü açı?',['45°','55°','65°'],1],['Çeyrek dönüş kaç derecedir?',['90°','180°','360°'],0],['Yarım dönüş kaç derecedir?',['360°','90°','180°'],2],['Saat 3:00 kaç derecelik açı yapar?',['90°','180°','60°'],0],['Saat 6:00 kaç derecelik açı yapar?',['90°','180°','360°'],1],['Üçgenin kaç kenarı vardır?',['4','3','5'],1],['Beşgenin kaç kenarı vardır?',['6','4','5'],2],['Altıgenin kaç köşesi vardır?',['6','5','8'],0],['Karenin kaç eşit kenarı vardır?',['2','4','3'],1],['Dikdörtgenin kaç köşesi vardır?',['3','4','5'],1],['Bir ışının kaç başlangıç noktası vardır?',['1','2','3'],0],['Paralel doğrular kesişir mi?',['Evet','Hayır','Daima'],1],['100 + 250 kaç eder?',['350','300','450'],0],['800 - 275 kaç eder?',['525','535','625'],0],['12 × 8 kaç eder?',['86','96','108'],1],['144 ÷ 12 kaç eder?',['14','11','12'],2],['Bir düzine kaçtır?',['10','12','20'],1],['En küçük üç basamaklı sayı?',['101','100','999'],1],['90° + 45° hangi açı türüdür?',['Dar','Geniş','Dik'],1],['270° kaç dik açı eder?',['2','3','4'],1],['Bir tam açı kaç doğru açıdır?',['2','3','4'],0],['Dik üçgende bir açı kaç derecedir?',['90°','60°','120°'],0],['Düz açının yarısı kaçtır?',['45°','90°','180°'],1],['60° + 60° kaç derecedir?',['100°','120°','150°'],1],['Doğru parçasının kaç ucu vardır?',['1','2','0'],1],['Çemberin tam dönüşü kaç derecedir?',['180°','360°','90°'],1]
];let deck=[],q=null,lane=1,vl=1,score=0,lives=3,stage=1,progress=0,time=0,active=false,locked=false,flash='',flashTimer=0,last=0,round=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function update(){document.getElementById('score').textContent='⭐ '+score;document.getElementById('stage').textContent='ETAP '+stage;document.getElementById('lives').textContent='❤️'.repeat(lives)}function next(){if(!deck.length)deck=shuffle([...bank.keys()]);let a=bank[deck.pop()],options=shuffle(a[1].map((text,i)=>({text,correct:i===a[2]})));q={text:a[0],options,correct:options.findIndex(v=>v.correct)};document.getElementById('question').textContent=q.text;progress=0;locked=false;round++;stage=1+Math.floor(score/50);update()}function move(d){if(active)lane=Math.max(0,Math.min(2,lane+d))}document.getElementById('left').onpointerdown=e=>{e.preventDefault();move(-1)};document.getElementById('right').onpointerdown=e=>{e.preventDefault();move(1)};addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1)});let sx=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});c.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>25)move(d>0?1:-1)},{passive:true});document.getElementById('start').onclick=()=>{score=0;lives=3;stage=1;lane=1;vl=1;time=0;round=0;deck=[];active=true;flash='';document.getElementById('overlay').style.display='none';next();last=performance.now()};
function P(t){return {y:H*.33+H*.76*t*t,spread:W*(.06+.28*t)}}function X(k,t){return W/2+(k-1)*P(t).spread}function line(x,y,x2,y2,color,w){g.beginPath();g.strokeStyle=color;g.lineWidth=w;g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}function box(x,y,w,h,r,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function scenery(){let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#15396e');grad.addColorStop(.45,'#79c5e8');grad.addColorStop(.46,'#76ba70');grad.addColorStop(1,'#295d36');g.fillStyle=grad;g.fillRect(0,0,W,H);g.fillStyle='#ffe4a0';g.beginPath();g.arc(W*.82,H*.17,27,0,7);g.fill();for(let i=0;i<17;i++){let x=(i*113+33)%W,y=H*(.34+(i%4)*.023);g.fillStyle=i%2?'#2d7548':'#45895a';g.beginPath();g.moveTo(x-26,y+24);g.lineTo(x,y-43);g.lineTo(x+26,y+24);g.fill();g.fillStyle='#694c2c';g.fillRect(x-4,y+20,8,17)}}
function tracks(){let far=P(0),near=P(1);g.fillStyle='#615649';g.beginPath();g.moveTo(W/2-15,far.y);g.lineTo(W/2+15,far.y);g.lineTo(W/2+near.spread*1.6,H);g.lineTo(W/2-near.spread*1.6,H);g.fill();for(let k=0;k<3;k++){for(let j=0;j<23;j++){let t=(j/23+time*.28)%1,p=P(t),x=X(k,t),w=5+30*t;line(x-w,p.y,x+w,p.y,'#a97c51',2+7*t)}for(let s of [-1,1]){line(X(k,0)+s*3,far.y,X(k,1)+s*17,near.y,'#202a33',7);line(X(k,0)+s*3,far.y,X(k,1)+s*17,near.y,'#dce3e8',3)}}}
function signs(){if(!q)return;let t=.38+progress*.51,p=P(t),scale=.55+t*.55;for(let k=0;k<3;k++){let x=X(k,t),y=p.y-78*scale,w=Math.min(W*.30,160)*scale,h=62*scale;line(x,y+h/2,x,p.y,'#e1e6ea',4*scale);box(x-w/2,y-h/2,w,h,8,'#0b2b51');g.strokeStyle='#ffd65b';g.lineWidth=2;g.strokeRect(x-w/2+3,y-h/2+3,w-6,h-6);g.fillStyle='white';g.textAlign='center';g.textBaseline='middle';let txt=q.options[k].text,words=txt.split(' ');let size=Math.max(10,Math.min(17,W*.043)*scale);if(txt.length>15){g.font='bold '+Math.max(9,size*.78)+'px Arial';let mid=Math.ceil(words.length/2);g.fillText(words.slice(0,mid).join(' '),x,y-9);g.fillText(words.slice(mid).join(' '),x,y+10)}else{g.font='bold '+size+'px Arial';g.fillText(txt,x,y)}}}
function hugo(){let x=X(vl,.89),y=H*.85+Math.sin(time*13)*3;g.save();g.translate(x,y);g.fillStyle='#0006';g.beginPath();g.ellipse(0,20,28,10,0,0,7);g.fill();box(-21,0,18,22,5,'#442b22');box(4,0,18,22,5,'#442b22');box(-17,-37,13,42,4,'#285c93');box(4,-37,13,42,4,'#285c93');box(-26,-90,52,57,12,'#e8443b');box(-15,-80,30,42,7,'#f0bf3e');box(-36,-83,11,43,6,'#e5ad87');box(25,-83,11,43,6,'#e5ad87');g.fillStyle='#eeb58d';g.beginPath();g.arc(0,-111,26,0,7);g.fill();g.fillStyle='#5b3825';g.beginPath();g.arc(0,-124,26,Math.PI,Math.PI*2);g.fill();g.fillStyle='white';g.beginPath();g.arc(-9,-112,6,0,7);g.arc(9,-112,6,0,7);g.fill();g.fillStyle='#182534';g.beginPath();g.arc(-8,-111,2.5,0,7);g.arc(10,-111,2.5,0,7);g.fill();g.strokeStyle='#74442f';g.lineWidth=2;g.beginPath();g.arc(0,-103,8,.2,Math.PI-.2);g.stroke();box(-28,-144,56,13,5,'#f6d03d');box(-20,-152,40,12,5,'#eeb42d');g.restore()}
function evaluate(){if(locked)return;locked=true;let good=lane===q.correct;if(good){score+=10;flash='✅ DOĞRU! +10 PUAN'}else{lives--;flash='❌ YANLIŞ! Doğru: '+q.options[q.correct].text}flashTimer=.9;document.getElementById('message').textContent=flash;update();if(lives<=0){active=false;document.getElementById('overlay').style.display='flex';document.querySelector('#overlay h1').textContent='OYUN BİTTİ';document.querySelector('#overlay h2').textContent=score+' PUAN';document.querySelector('#overlay p').textContent='Harika mücadele! Yeniden oynayarak daha yüksek puan kazanabilirsin.';document.getElementById('start').textContent='YENİDEN OYNA ▶';return}setTimeout(()=>{if(active)next()},650)}function frame(now){let dt=Math.min((now-last)/1000||0,.05);last=now;scenery();tracks();if(active){time+=dt;vl+=(lane-vl)*Math.min(1,dt*11);if(!locked){progress+=dt*(.12+Math.min(stage,12)*.009);if(progress>=1)evaluate()}if(flashTimer>0){flashTimer-=dt;if(flashTimer<=0)document.getElementById('message').textContent=''}signs()}hugo();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
