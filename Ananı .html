<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hugo Matematik Treni</title><style>body{margin:0;background:#10203b;color:white;font-family:system-ui;text-align:center}h2{margin:14px 0 8px}#stats{font-size:20px;margin-bottom:8px}canvas{display:block;width:min(96vw,520px);height:auto;margin:auto;border:5px solid white;border-radius:20px;background:#7bcaf1}#question{font-weight:800;font-size:23px;margin:12px}button{background:#ffdc4b;border:0;border-radius:15px;padding:17px 12px;font-size:18px;font-weight:800;color:#0873bf;margin:4px;cursor:pointer}#choices{display:flex;justify-content:center}#choices button{width:31%}#msg{min-height:25px}#reset{background:#294666;color:white;font-size:14px;padding:10px}</style><h2>🚂 HUGO MATEMATİK TRENİ</h2><div id="stats"></div><canvas id="game" width="420" height="460"></canvas><div id="question"></div><div id="choices"><button onclick="choose(0)">SOL RAY</button><button onclick="choose(1)">ORTA RAY</button><button onclick="choose(2)">SAĞ RAY</button></div><div id="msg">Doğru rayı seç ve Hugo'yu kurtar!</div><button id="reset" onclick="restart()">🔄 Yeniden başla</button><script>
const c=document.getElementById('game'),x=c.getContext('2d');let score,life,level,round,phase,progress,target,wrong,questions,answer,labels,promptText,last=0;
const bank=[['Dik açı',90],['Dar açı',35],['Geniş açı',140],['Doğru açı',180],['Tam açı',360],['Sıfır açı',0],['Tümler açılar toplamı',90],['Bütünler açılar toplamı',180],['Dik açıdan küçük açı',45],['90° ile 180° arasındaki açı',120],['Refleks açı',240],['Eş açılar',60]];
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function next(){let a=shuffle([...bank]).slice(0,3);answer=Math.floor(Math.random()*3);let q=a[answer];labels=a;promptText=q[0]+' olan rayı seç!';document.getElementById('question').textContent='📐 '+promptText;phase='wait';progress=0;wrong=false;document.getElementById('msg').textContent='Doğru rayı seç ve Hugo’yu kurtar!';update()}
function update(){document.getElementById('stats').textContent=`⭐ Puan: ${score}   🏆 Seviye: ${level}   ❤️ ${life}`}
function restart(){score=0;life=3;level=1;round=0;target=1;next()}
function choose(n){if(phase!=='wait')return;target=n;wrong=n!==answer;phase='move';progress=0;document.getElementById('msg').textContent=wrong?'⚠️ Yanlış ray!':'🚂 Hugo ilerliyor!'}
function line(ax,ay,bx,by,w,color){x.strokeStyle=color;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke()}
function rails(endX,offset){let sx=210,sy=430,ey=155;let dx=endX-sx;for(let side of [-1,1])line(sx+side*12,sy,endX+side*12,ey,5,'#eee');for(let j=0;j<11;j++){let t=((j/11+offset)%1),y=sy+(ey-sy)*t,cx=sx+dx*t;line(cx-19,y,cx+19,y,6,'#a77748')}}
function draw(t){let dt=Math.min(40,t-last||16);last=t;x.clearRect(0,0,420,460);x.fillStyle='#83cef6';x.fillRect(0,0,420,180);x.fillStyle='#5eb14f';x.fillRect(0,180,420,280);x.fillStyle='#ffe9a1';x.beginPath();x.arc(365,54,27,0,7);x.fill();let shift=phase==='move'?progress/300:0;[90,210,330].forEach((ex,i)=>rails(ex,shift));labels.forEach((a,i)=>{let px=10+i*140;x.fillStyle='#243e5d';x.fillRect(px+4,30,132,92);x.fillStyle='white';x.font='bold 15px system-ui';x.textAlign='center';x.fillText(a[0].length>17?a[0].slice(0,16)+'…':a[0],px+70,53);x.strokeStyle='white';x.lineWidth=3;x.beginPath();x.moveTo(px+48,88);x.lineTo(px+78,88);let angle=a[1]*Math.PI/180;x.lineTo(px+78+22*Math.cos(angle),88-22*Math.sin(angle));x.stroke();x.fillStyle='#ffdc4b';x.font='bold 20px system-ui';x.fillText(a[1]+'°',px+70,112)});
let p=phase==='move'?Math.min(1,progress/850):0;let xx=210+([90,210,330][target]-210)*p,yy=388-225*p;x.save();x.translate(xx,yy);x.fillStyle='#d73535';x.fillRect(-23,-27,46,51);x.fillStyle='#ffdb44';x.fillRect(-17,-21,34,21);x.fillStyle='#20a3d2';x.fillRect(-18,6,36,14);x.fillStyle='white';x.font='bold 13px system-ui';x.fillText('HUGO',0,18);x.fillStyle='#262626';x.fillRect(-14,-38,28,11);x.fillStyle='#eee';x.beginPath();x.arc(0,-44,8,0,7);x.fill();x.restore();if(phase==='move'){progress+=dt;if(progress>=850){phase='done';setTimeout(()=>{if(wrong){life--;document.getElementById('msg').textContent='💥 Yanlış seçim! Bir can gitti.'}else{score+=10;round++;level=1+Math.floor(round/5);document.getElementById('msg').textContent='✅ Harika! Yeni soru geliyor.'}if(life<=0){phase='over';document.getElementById('question').textContent='Oyun bitti! Puan: '+score;document.getElementById('msg').textContent='Yeniden başla ve Hugo’yu kurtar.';update()}else next()},450)}}requestAnimationFrame(draw)}restart();requestAnimationFrame(draw);
</script></html>
